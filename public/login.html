<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Atik's Addaverse</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🎬</div>
        <h1 class="auth-title">Atik's Addaverse</h1>
        <p class="auth-subtitle">Direct Cloud Streaming & Creator Studio</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <!-- 1-Click Google Sign In Button -->
      <button id="googleSignInBtn" type="button" class="btn btn-secondary btn-block" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; margin-bottom: 20px; font-weight: 700; border-color: rgba(255,255,255,0.15);">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div style="display: flex; align-items: center; margin: 18px 0; color: var(--text-muted); font-size: 0.8rem;">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="padding: 0 12px;">OR WITH EMAIL</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginInput">Username or Email</label>
          <input type="text" id="loginInput" class="input-box" placeholder="Enter username or email" required autofocus>
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" class="input-box" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
          <span>Sign In to Studio</span>
        </button>
      </form>

      <p style="margin-top: 22px; text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
        Don't have an account? <a href="/register.html">Create an Account</a>
      </p>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.82rem; font-weight: 600; color: var(--crimson);">
        Designed by Argho The Great
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/auth/google/url');
        const data = await res.json();
        if (data.authUrl) {
          window.location.href = data.authUrl;
        } else {
          alert(data.error || 'Google Login not configured');
        }
      } catch (e) {
        alert('Could not start Google login: ' + e.message);
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to sign in');
        }

        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerText = err.message;
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In to Studio';
      }
    });
  </script>
</body>
</html>
